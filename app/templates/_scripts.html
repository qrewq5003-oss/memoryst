<script>
// This script block now runs on two pages with different markup: the memory list
// and Tools. A bare document.getElementById(...).addEventListener throws on the
// page that lacks the element, and one throw kills every handler defined after
// it - including the on-demand details loader at the bottom. `on` binds only when
// the element is actually there.
function on(id, event, handler) {
    const el = document.getElementById(id);
    if (el) el.addEventListener(event, handler);
}
// Consolidation selection persists in localStorage (keyed by chat/character) rather
// than living only in checkbox DOM state - the candidate pool can span more memories
// than one page shows, and a page-only Set would silently drop anything selected on
// a page the user has since navigated away from.
function consolidateStorageKey() {
    // Null-safe for the same reason as `on`: the memory list has no consolidation
    // form, and this runs at load time on both pages.
    const chatId = document.getElementById('consolidate-chat-id')?.value || '';
    const charId = document.getElementById('consolidate-char-id')?.value || '';
    return `consolidate-selected::${chatId}::${charId}`;
}

function loadConsolidateSelection() {
    try {
        const raw = localStorage.getItem(consolidateStorageKey());
        return new Set(raw ? JSON.parse(raw) : []);
    } catch (e) {
        return new Set();
    }
}

function saveConsolidateSelection(set) {
    try {
        localStorage.setItem(consolidateStorageKey(), JSON.stringify(Array.from(set)));
    } catch (e) {}
}

function getSelectedConsolidationIds() {
    return Array.from(loadConsolidateSelection());
}

function updateConsolidateSelectedCount() {
    const countEl = document.getElementById('consolidate-selected-count');
    if (countEl) countEl.textContent = String(loadConsolidateSelection().size);
}

// Reflect the persisted selection onto whichever checkboxes happen to be
// rendered on this page (memories not on this page stay selected, just
// without a visible checkbox to show it).
function syncConsolidateCheckboxes() {
    const set = loadConsolidateSelection();
    document.querySelectorAll('.consolidate-checkbox').forEach(cb => {
        cb.checked = set.has(cb.dataset.memoryId);
    });
    updateConsolidateSelectedCount();
}

document.addEventListener('change', (e) => {
    if (!e.target.matches('.consolidate-checkbox')) return;
    const set = loadConsolidateSelection();
    if (e.target.checked) set.add(e.target.dataset.memoryId);
    else set.delete(e.target.dataset.memoryId);
    saveConsolidateSelection(set);
    updateConsolidateSelectedCount();
});

on('consolidate-select-all', 'click', () => {
    let ids = [];
    try { ids = JSON.parse(document.getElementById('consolidate-all-candidates').textContent); } catch (e) {}
    const set = loadConsolidateSelection();
    ids.forEach(id => set.add(id));
    saveConsolidateSelection(set);
    syncConsolidateCheckboxes();
});

on('consolidate-clear-selection', 'click', () => {
    saveConsolidateSelection(new Set());
    syncConsolidateCheckboxes();
});

syncConsolidateCheckboxes();

// Consolidation handler
on('consolidate-form', 'submit', async (e) => {
    e.preventDefault();
    const chatId = document.getElementById('consolidate-chat-id').value;
    const charId = document.getElementById('consolidate-char-id').value;
    const tier = document.getElementById('consolidate-tier').value;
    const model = document.getElementById('consolidate-model').value || null;
    const sourceIds = getSelectedConsolidationIds();
    const result = document.getElementById('consolidate-result');
    const preview = document.getElementById('consolidate-preview');

    if (!chatId) { result.textContent = 'Select a chat first.'; return; }
    if (sourceIds.length === 0) { result.textContent = 'Select at least one memory to consolidate.'; return; }

    result.textContent = `Consolidating (${tier})...`;
    preview.style.display = 'none';

    try {
        const body = { chat_id: chatId, character_id: charId, tier, source_ids: sourceIds };
        if (model) body.model = model;

        const resp = await fetch('/memory/consolidate', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(body),
        });

        if (resp.ok) {
            const data = await resp.json();
            if (data.action === 'created') {
                result.textContent = `${tier} created (${data.summarized_count} sources)!`;
                document.getElementById('consolidate-preview-title').textContent = `${tier.toUpperCase()} Summary`;
                document.getElementById('consolidate-preview-content').textContent = data.summary_text || '';
                preview.style.display = 'block';
                saveConsolidateSelection(new Set());
                syncConsolidateCheckboxes();
            } else {
                result.textContent = `${data.action} (${data.summarized_count} sources)`;
            }
        } else {
            result.textContent = `Error: ${resp.status}`;
        }
    } catch (e) {
        result.textContent = `Error: ${e.message}`;
    }
});

// Clip handler
on('clip-form', 'submit', async (e) => {
    e.preventDefault();
    const text = document.getElementById('clip-text').value.trim();
    const chatId = document.getElementById('clip-chat-id').value || 'clip';
    const charId = document.getElementById('clip-char-id').value || 'clip';
    const result = document.getElementById('clip-result');

    if (!text) { result.textContent = 'Enter a fact to save.'; return; }

    try {
        const resp = await fetch('/memory/clip', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ chat_id: chatId, character_id: charId, text }),
        });
        if (resp.ok) {
            const data = await resp.json();
            result.textContent = data.stored ? 'Clip saved!' : 'Failed.';
            if (data.stored) document.getElementById('clip-text').value = '';
        } else {
            result.textContent = `Error: ${resp.status}`;
        }
    } catch (e) {
        result.textContent = `Error: ${e.message}`;
    }
});

// Load providers + models for the active provider, and populate every model select.
async function loadModels() {
    try {
        const resp = await fetch('/memory/models');
        if (!resp.ok) return;
        const data = await resp.json();
        const providers = data.providers || [];
        const activeProvider = data.active_provider;
        const models = data.models || [];
        const def = data.default;

        const providerSelect = document.getElementById('llm-provider-select');
        if (providerSelect) {
            providerSelect.innerHTML = '';
            providers.forEach(p => {
                const opt = document.createElement('option');
                opt.value = p;
                opt.textContent = p;
                opt.selected = p === activeProvider;
                providerSelect.appendChild(opt);
            });
        }

        ['llm-model-select', 'scene-model', 'consolidate-model', 'tracker-model'].forEach(id => {
            const select = document.getElementById(id);
            if (!select) return;
            const placeholder = id === 'llm-model-select' ? null : '';
            select.innerHTML = '';
            if (placeholder !== null) {
                const opt = document.createElement('option');
                opt.value = placeholder;
                opt.textContent = 'default';
                select.appendChild(opt);
            }
            models.forEach(m => {
                const opt = document.createElement('option');
                opt.value = m;
                opt.textContent = m === def ? `${m} (default)` : m;
                select.appendChild(opt);
            });
        });
    } catch (e) {}
}

loadModels();

// Provider switch handler
on('llm-provider-form', 'submit', async (e) => {
    e.preventDefault();
    const provider = document.getElementById('llm-provider-select').value;
    const result = document.getElementById('llm-provider-result');

    result.textContent = `Switching to ${provider}...`;

    try {
        const resp = await fetch('/memory/provider', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ provider }),
        });
        if (resp.ok) {
            const data = await resp.json();
            result.textContent = `Active provider: ${data.active_provider}`;
            await loadModels();
        } else {
            const data = await resp.json().catch(() => ({}));
            result.textContent = `Error: ${data.detail || resp.status}`;
        }
    } catch (e) {
        result.textContent = `Error: ${e.message}`;
    }
});

// Scene extraction handler
on('scene-extract-form', 'submit', async (e) => {
    e.preventDefault();
    const text = document.getElementById('scene-text').value.trim();
    const chatId = document.getElementById('scene-chat-id').value || 'scene';
    const charId = document.getElementById('scene-char-id').value || 'scene';
    const model = document.getElementById('scene-model').value || null;
    const result = document.getElementById('scene-result');
    const preview = document.getElementById('scene-preview');

    if (!text) { result.textContent = 'Paste scene text first.'; return; }

    const messages = text.split('\n').map(line => {
        const m = line.match(/^\[(user|assistant)\]:\s*(.+)$/i);
        return m ? { role: m[1].toLowerCase(), text: m[2].trim() } : null;
    }).filter(Boolean);

    if (messages.length === 0) {
        result.textContent = 'No valid messages. Use format: [assistant]: text';
        return;
    }

    result.textContent = 'Extracting with LLM...';
    preview.style.display = 'none';

    try {
        const body = { chat_id: chatId, character_id: charId, messages };
        if (model) body.model = model;

        const resp = await fetch('/memory/scene', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(body),
        });

        if (resp.ok) {
            const data = await resp.json();
            if (data.stored) {
                result.textContent = 'Memory stored!';
                document.getElementById('scene-preview-title').textContent = data.title || 'Untitled';
                document.getElementById('scene-preview-content').textContent = data.content || '';
                document.getElementById('scene-preview-meta').textContent =
                    `Type: ${data.type || '?'} | Keywords: ${(data.keywords || []).join(', ')} | Mood: ${data.mood || '?'}`;
                preview.style.display = 'block';
            } else {
                result.textContent = 'LLM extraction failed or duplicate. Try with different text.';
            }
        } else {
            result.textContent = `Error: ${resp.status}`;
        }
    } catch (e) {
        result.textContent = `Error: ${e.message}`;
    }
});

// Tracker update handlers. TRACKER_LLM_TIMEOUT is 120s per attempt (with one retry, a
// single click can legitimately take a few minutes) - the button must go into a visibly
// "working" state right away and never block the rest of the page while it waits.
const TRACKER_LABELS = {
    timeline: 'Timeline',
    relationship: 'Relationship',
    npc_whoswho: "NPC Who's Who",
    character_pov_notes: 'Character POV Notes',
};

function trackerStatusEl(trackerType) {
    return document.getElementById(`tracker-status-${trackerType}`);
}

// Re-pulls one tracker's saved state from GET /memory/trackers so "updated_at" and
// "messages_since_update" reflect the server after a create/update, without a full
// page reload. Used after every button click, success or not, so the meta line never
// goes stale relative to what's actually stored.
async function refreshTrackerCard(chatId, charId, trackerType) {
    const meta = document.getElementById(`tracker-meta-${trackerType}`);
    const content = document.getElementById(`tracker-content-${trackerType}`);
    if (!meta || !content) return;

    try {
        const resp = await fetch(`/memory/trackers?chat_id=${encodeURIComponent(chatId)}&character_id=${encodeURIComponent(charId)}`);
        if (!resp.ok) return;
        const data = await resp.json();
        const item = (data.items || []).find(i => i.tracker_type === trackerType);
        if (item) {
            meta.textContent = `обновлено: ${item.updated_at} | сообщений с обновления: ${item.messages_since_update}`;
            content.textContent = item.content || '';
        } else {
            meta.textContent = 'ещё не сгенерирован';
            content.textContent = '';
        }
    } catch (e) {
        // Best-effort refresh only - the button's own success/error message already
        // told the user what happened, so a failed refresh here stays silent.
    }
}

document.querySelectorAll('.tracker-update-btn').forEach(btn => {
    btn.addEventListener('click', async () => {
        const trackerType = btn.dataset.trackerType;
        const chatId = document.getElementById('tracker-chat-id').value;
        const charId = document.getElementById('tracker-char-id').value;
        const modelSelect = document.getElementById('tracker-model');
        const model = modelSelect && modelSelect.value ? modelSelect.value : null;
        const status = trackerStatusEl(trackerType);

        if (!chatId || !charId) {
            if (status) status.textContent = 'Select a chat first.';
            return;
        }

        // Enter "working" state immediately, before the request even goes out.
        const originalLabel = btn.textContent;
        btn.disabled = true;
        btn.textContent = 'Обновляется…';
        if (status) {
            status.textContent = '';
            status.className = 'tracker-status';
        }

        try {
            const body = { chat_id: chatId, character_id: charId, tracker_type: trackerType };
            if (model) body.model = model;

            const resp = await fetch('/memory/tracker/update', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(body),
            });

            if (resp.ok) {
                const data = await resp.json();
                if (data.action === 'skipped_llm_failed' || data.action === 'skipped_llm_unavailable') {
                    if (status) {
                        status.textContent = data.error_detail || `${TRACKER_LABELS[trackerType]}: update failed (${data.action}).`;
                        status.className = 'tracker-status tracker-status-error';
                    }
                } else if (data.action === 'skipped_no_new_messages') {
                    if (status) {
                        status.textContent = 'No new messages since the last update.';
                        status.className = 'tracker-status';
                    }
                } else {
                    if (status) {
                        status.textContent = `${data.action === 'created' ? 'Created' : 'Updated'} (${data.entries_count} entries).`;
                        status.className = 'tracker-status tracker-status-ok';
                    }
                }
                await refreshTrackerCard(chatId, charId, trackerType);
            } else {
                const data = await resp.json().catch(() => ({}));
                if (status) {
                    status.textContent = `Error: ${data.detail || resp.status}`;
                    status.className = 'tracker-status tracker-status-error';
                }
            }
        } catch (e) {
            if (status) {
                status.textContent = `Error: ${e.message}`;
                status.className = 'tracker-status tracker-status-error';
            }
        } finally {
            btn.disabled = false;
            btn.textContent = originalLabel;
        }
    });
});

// Inspect Details is fetched the first time a card is expanded. A collapsed
// <details> still ships everything inside it, and across the list that was 202KB
// of a 366KB page - 55% of the bytes, none of them looked at until opened.
// Without JavaScript the placeholder is a link to the same content on its own
// page, so expanding a card keeps working either way.
document.addEventListener('toggle', async (event) => {
    const details = event.target;
    if (!(details instanceof HTMLDetailsElement)) return;
    if (!details.open || !details.dataset.memoryId || details.dataset.loaded) return;

    const body = details.querySelector('.details-body');
    if (!body) return;

    details.dataset.loaded = 'pending';
    body.textContent = 'Загружаю…';
    try {
        const part = details.dataset.part || 'inspect';
        const response = await fetch(`/ui/memory/${encodeURIComponent(details.dataset.memoryId)}/fragment?part=${part}`);
        if (!response.ok) throw new Error(String(response.status));
        body.innerHTML = await response.text();
        details.dataset.loaded = 'done';
    } catch (error) {
        // Leave the fallback link in place: a failed fetch must not strand the
        // user with an empty disclosure.
        details.dataset.loaded = '';
        body.innerHTML = `<a href="/ui/memory/${encodeURIComponent(details.dataset.memoryId)}">Открыть подробности</a>`;
    }
}, true);
</script>
