<script>
// Selection checkbox counter
function getSelectedConsolidationIds() {
    return Array.from(document.querySelectorAll('.consolidate-checkbox:checked'))
        .map(el => el.dataset.memoryId);
}

function updateConsolidateSelectedCount() {
    const countEl = document.getElementById('consolidate-selected-count');
    if (countEl) countEl.textContent = String(getSelectedConsolidationIds().length);
}

document.addEventListener('change', (e) => {
    if (e.target.matches('.consolidate-checkbox')) updateConsolidateSelectedCount();
});

updateConsolidateSelectedCount();

// Consolidation handler
document.getElementById('consolidate-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const chatId = document.getElementById('consolidate-chat-id').value;
    const charId = document.getElementById('consolidate-char-id').value;
    const tier = document.getElementById('consolidate-tier').value;
    const model = document.getElementById('consolidate-model').value || null;
    const sourceIds = getSelectedConsolidationIds();
    const result = document.getElementById('consolidate-result');
    const preview = document.getElementById('consolidate-preview');

    if (!chatId) { result.textContent = 'Select a chat first.'; return; }
    if (sourceIds.length === 0) { result.textContent = 'Select at least one memory to consolidate.'; return; }

    result.textContent = `Consolidating (${tier})...`;
    preview.style.display = 'none';

    try {
        const body = { chat_id: chatId, character_id: charId, tier, source_ids: sourceIds };
        if (model) body.model = model;

        const resp = await fetch('/memory/consolidate', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(body),
        });

        if (resp.ok) {
            const data = await resp.json();
            if (data.action === 'created') {
                result.textContent = `${tier} created (${data.summarized_count} sources)!`;
                document.getElementById('consolidate-preview-title').textContent = `${tier.toUpperCase()} Summary`;
                document.getElementById('consolidate-preview-content').textContent = data.summary_text || '';
                preview.style.display = 'block';
            } else {
                result.textContent = `${data.action} (${data.summarized_count} sources)`;
            }
        } else {
            result.textContent = `Error: ${resp.status}`;
        }
    } catch (e) {
        result.textContent = `Error: ${e.message}`;
    }
});

// Clip handler
document.getElementById('clip-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const text = document.getElementById('clip-text').value.trim();
    const chatId = document.getElementById('clip-chat-id').value || 'clip';
    const charId = document.getElementById('clip-char-id').value || 'clip';
    const result = document.getElementById('clip-result');

    if (!text) { result.textContent = 'Enter a fact to save.'; return; }

    try {
        const resp = await fetch('/memory/clip', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ chat_id: chatId, character_id: charId, text }),
        });
        if (resp.ok) {
            const data = await resp.json();
            result.textContent = data.stored ? 'Clip saved!' : 'Failed.';
            if (data.stored) document.getElementById('clip-text').value = '';
        } else {
            result.textContent = `Error: ${resp.status}`;
        }
    } catch (e) {
        result.textContent = `Error: ${e.message}`;
    }
});

// Load providers + models for the active provider, and populate every model select.
async function loadModels() {
    try {
        const resp = await fetch('/memory/models');
        if (!resp.ok) return;
        const data = await resp.json();
        const providers = data.providers || [];
        const activeProvider = data.active_provider;
        const models = data.models || [];
        const def = data.default;

        const providerSelect = document.getElementById('llm-provider-select');
        if (providerSelect) {
            providerSelect.innerHTML = '';
            providers.forEach(p => {
                const opt = document.createElement('option');
                opt.value = p;
                opt.textContent = p;
                opt.selected = p === activeProvider;
                providerSelect.appendChild(opt);
            });
        }

        ['llm-model-select', 'scene-model', 'consolidate-model'].forEach(id => {
            const select = document.getElementById(id);
            if (!select) return;
            const placeholder = id === 'llm-model-select' ? null : '';
            select.innerHTML = '';
            if (placeholder !== null) {
                const opt = document.createElement('option');
                opt.value = placeholder;
                opt.textContent = 'default';
                select.appendChild(opt);
            }
            models.forEach(m => {
                const opt = document.createElement('option');
                opt.value = m;
                opt.textContent = m === def ? `${m} (default)` : m;
                select.appendChild(opt);
            });
        });
    } catch (e) {}
}

loadModels();

// Provider switch handler
document.getElementById('llm-provider-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const provider = document.getElementById('llm-provider-select').value;
    const result = document.getElementById('llm-provider-result');

    result.textContent = `Switching to ${provider}...`;

    try {
        const resp = await fetch('/memory/provider', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ provider }),
        });
        if (resp.ok) {
            const data = await resp.json();
            result.textContent = `Active provider: ${data.active_provider}`;
            await loadModels();
        } else {
            const data = await resp.json().catch(() => ({}));
            result.textContent = `Error: ${data.detail || resp.status}`;
        }
    } catch (e) {
        result.textContent = `Error: ${e.message}`;
    }
});

// Scene extraction handler
document.getElementById('scene-extract-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const text = document.getElementById('scene-text').value.trim();
    const chatId = document.getElementById('scene-chat-id').value || 'scene';
    const charId = document.getElementById('scene-char-id').value || 'scene';
    const model = document.getElementById('scene-model').value || null;
    const result = document.getElementById('scene-result');
    const preview = document.getElementById('scene-preview');

    if (!text) { result.textContent = 'Paste scene text first.'; return; }

    const messages = text.split('\n').map(line => {
        const m = line.match(/^\[(user|assistant)\]:\s*(.+)$/i);
        return m ? { role: m[1].toLowerCase(), text: m[2].trim() } : null;
    }).filter(Boolean);

    if (messages.length === 0) {
        result.textContent = 'No valid messages. Use format: [assistant]: text';
        return;
    }

    result.textContent = 'Extracting with LLM...';
    preview.style.display = 'none';

    try {
        const body = { chat_id: chatId, character_id: charId, messages };
        if (model) body.model = model;

        const resp = await fetch('/memory/scene', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(body),
        });

        if (resp.ok) {
            const data = await resp.json();
            if (data.stored) {
                result.textContent = 'Memory stored!';
                document.getElementById('scene-preview-title').textContent = data.title || 'Untitled';
                document.getElementById('scene-preview-content').textContent = data.content || '';
                document.getElementById('scene-preview-meta').textContent =
                    `Type: ${data.type || '?'} | Keywords: ${(data.keywords || []).join(', ')} | Mood: ${data.mood || '?'}`;
                preview.style.display = 'block';
            } else {
                result.textContent = 'LLM extraction failed or duplicate. Try with different text.';
            }
        } else {
            result.textContent = `Error: ${resp.status}`;
        }
    } catch (e) {
        result.textContent = `Error: ${e.message}`;
    }
});
</script>
