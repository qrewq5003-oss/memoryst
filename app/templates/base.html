<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Memory Service{% endblock %}</title>
    <link rel="stylesheet" href="/static/styles.css?v={{ asset_version }}">
    <link rel="manifest" href="/static/manifest.json">
    <meta name="theme-color" content="#16213e">
</head>
<script>
        // Runs before the body renders: reading the stored choice afterwards would
        // paint the light theme first and flash it on a dark phone.
        try {
            const saved = localStorage.getItem('memoryst-theme');
            if (saved) document.documentElement.dataset.theme = saved;
        } catch (e) {}
    </script>
<body>
    <div class="container">
        {% block content %}{% endblock %}
    </div>
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/static/sw.js');
        }
    </script>
</body>
</html>
