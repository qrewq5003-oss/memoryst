# Retrieval scoring weights for app/services/retrieve_service.py.
#
# Bump `version` whenever values here change so it's traceable in eval runs
# and logs. Tune via scripts/run_retrieval_eval.py, not by hand-guessing —
# these are tightly coupled to the eval cases in app/evals/retrieval_eval_cases.py.

version: 1

weights:
  keyword_weight: 0.50
  entity_weight: 0.25
  importance_weight: 0.12
  recency_weight: 0.03
  pinned_bonus: 0.05
  both_match_bonus: 0.10
  min_retrieval_score: 0.15
  near_duplicate_token_overlap: 0.80
  close_score_layer_tie_epsilon: 0.05
  semantic_boost: 0.15
  # A semantic hit is not a yes/no. Measured over data/memory.db on 2026-09-20 with
  # gemini-embedding-2-preview: inside one chat the median cosine between arbitrary
  # memories is 0.591, p90 is 0.689 and genuinely related pairs sit at 0.81-0.86.
  # Taking the nearest 10 unconditionally - which is what this did before there was a
  # floor - handed the full boost to ten near-arbitrary memories, enough on its own to
  # push a candidate with no lexical match at all past min_retrieval_score.
  #
  # The floor is relative because the absolute scale is not comparable between chats:
  # every memory in a chat shares a cast, a setting and a narrator, so the whole
  # distribution shifts. semantic_relative_margin is how far above *this* chat's median
  # a match has to sit; semantic_min_similarity is a backstop for the Chroma path, which
  # reports no distribution.
  semantic_relative_margin: 0.12
  semantic_min_similarity: 0.62
  # Where the graded boost reaches full strength, also measured from the median and for
  # the same reason. The first cut of this was an absolute 0.82, taken from a
  # memory-to-memory measurement where both sides are extracted facts in the same terse
  # register. A real retrieve compares a *query* to a memory - raw roleplay prose against
  # a one-line fact - and that ceiling is simply never reached: measured on the live
  # "Alina volkova" chat (144 memories) on 2026-09-20, the best match for two real user
  # messages sat 0.139 and 0.138 above the median, so every surviving hit scored a
  # strength under 0.15 and the whole layer did nothing.
  semantic_full_strength_margin: 0.20
  relationship_cue_weight: 0.14
  episodic_specificity_bonus: 0.06
  episodic_low_value_penalty: 0.12
  combined_overlap_keyword_weight: 0.65
  combined_overlap_entity_weight: 0.35
  support_strong_threshold: 0.60
  support_medium_threshold: 0.30
  support_multiplier_strong: 1.0
  support_multiplier_medium: 0.6
  support_multiplier_weak: 0.25
  # Stage 5: automatic raw-history fallback fires when the best consolidated
  # score in the response is below this. raw_fallback_max_results caps the
  # FTS5 hits returned per fallback (both automatic and manual).
  raw_fallback_confidence_threshold: 0.35
  raw_fallback_max_results: 5

# Narrow support-only policy for Russian relationship/general-state phrasing:
# - gated by `relationship_query_like`
# - uses only the bounded cue groups from text_features
# - cannot replace the main lexical/entity ranking signal
# - must stay regression/eval-backed rather than becoming a general retrieval crutch
relationship_support_bonus_by_layer:
  summary: 0.03
  stable: 0.03
  episodic: 0.015

# Narrow support-only policy for Russian local-scene episodic precision:
# - gated by `local_scene_query_like`
# - only affects episodic candidates
# - helps concrete scene outcomes beat low-value query echoes
# - must not become a generic event heuristic or override a clearly stronger raw match
layer_selection_caps:
  summary: 1
  stable: 2
  episodic: 2

layer_tie_priority:
  summary: 2
  stable: 1
  episodic: 0
